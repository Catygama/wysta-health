<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>C-03 Registo</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<a href="index.html" class="back-link">← Mapa de Navegação</a>
	
	<div class="header">
		LOGO
	</div>

	<div class="content">
		<h1 class="text-center">Criar Conta</h1>

		<div class="input-group">
			<label>Nome</label>
			<input type="text" placeholder="O seu nome">
		</div>

		<div class="input-group">
			<label>Email</label>
			<input type="email" placeholder="exemplo@email.com">
		</div>

		<div class="input-group">
			<label>Data de Nascimento</label>
			<input type="date">
		</div>

		<div class="input-group">
			<label>Palavra-passe</label>
			<input type="password" placeholder="Mínimo 8 caracteres">
		</div>

		<div class="input-group">
			<label>Confirmar Palavra-passe</label>
			<input type="password" placeholder="Repetir palavra-passe">
		</div>

		<div class="card text-small">
			<input type="checkbox" id="terms"> 
			<label for="terms">Li e aceito os termos de utilização e política de privacidade</label>
		</div>

		<a href="u-01-dashboard.html" class="btn btn-primary">Criar Conta</a>
		
		<p class="text-center text-small mt-20">
			Já tem conta? <a href="c-02-login.html">Entrar</a>
		</p>
	</div>

</body>
</html>
