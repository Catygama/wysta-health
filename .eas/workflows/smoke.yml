name: Native smoke test

on:
  workflow_dispatch: {}

jobs:
  build_ios_simulator:
    name: Build iOS (simulator)
    type: build
    params:
      platform: ios
      profile: e2e
  build_android_emulator:
    name: Build Android (emulator)
    type: build
    params:
      platform: android
      profile: e2e

  maestro_ios:
    name: Maestro on iOS Simulator
    needs: [build_ios_simulator]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }}
      flow_path: ./maestro
      record_screen: true
  maestro_android:
    name: Maestro on Android Emulator
    needs: [build_android_emulator]
    type: maestro
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: ${{ needs.build_android_emulator.outputs.build_id }}
      flow_path: ./maestro
      record_screen: true
