# Smoke test for native builds: the app boots, reaches the login screen and the
# auth screens navigate. Runs in EAS Workflows (see .eas/workflows/smoke.yml).
# It stops short of signing in: test builds point at a real backend.
appId: health.wysta.app
name: Smoke — boot and auth navigation
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Saúde sexual e reprodutiva, com privacidade."
    timeout: 60000
- assertVisible:
    id: "auth-email-input"
- takeScreenshot: 01-login
- tapOn:
    id: "auth-register-link"
- assertVisible:
    id: "auth-password-confirm-input"
- takeScreenshot: 02-register
- tapOn:
    id: "auth-back-link"
- tapOn:
    id: "auth-professional-link"
- assertVisible: "Profissional"
- takeScreenshot: 03-professional-login
