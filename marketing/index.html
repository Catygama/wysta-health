<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wysta — Saúde sexual e reprodutiva feminina</title>
    <meta
      name="description"
      content="Plataforma digital de saúde sexual e reprodutiva feminina. Comunicação assíncrona com profissionais de saúde, em português."
    />
    <meta name="theme-color" content="#7C3AED" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C3AED'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-family='system-ui' font-size='18' font-weight='700' fill='white'%3EW%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --primary: #7c3aed;
        --primary-dark: #5b21b6;
        --text: #111827;
        --text-secondary: #6b7280;
        --bg: #ffffff;
        --bg-soft: #f9fafb;
        --border: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      main {
        min-height: 100vh;
        max-width: 720px;
        margin: 0 auto;
        padding: 64px 24px;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 64px;
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--primary);
        color: white;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 18px;
      }
      .brand {
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: 0 0 24px;
        font-weight: 700;
      }
      h1 em {
        font-style: normal;
        color: var(--primary);
      }
      .lede {
        font-size: 18px;
        color: var(--text-secondary);
        margin: 0 0 40px;
        max-width: 56ch;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 12px;
        transition: background 120ms ease;
      }
      .cta:hover {
        background: var(--primary-dark);
      }
      .meta {
        margin-top: auto;
        padding-top: 64px;
        font-size: 14px;
        color: var(--text-secondary);
        border-top: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true">W</div>
        <div class="brand">Wysta</div>
      </header>

      <h1>Cuidados de saúde sexual e reprodutiva, <em>em conversa.</em></h1>
      <p class="lede">
        Comunicação assíncrona com profissionais de saúde, em português.
        Privacidade primeiro, sem videochamadas, ao seu ritmo.
      </p>

      <a class="cta" href="https://app.wysta.health">Aceder à aplicação →</a>

      <footer class="meta">
        <span>© Wysta</span>
        <span>Em conformidade com o RGPD</span>
      </footer>
    </main>
  </body>
</html>
